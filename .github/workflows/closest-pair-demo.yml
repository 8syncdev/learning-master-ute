name: Closest Pair Demo

on:
  push:
    paths:
      - "algorithms/divide_and_conquer/closest_pair_points/demo-web/**"
      - ".github/workflows/closest-pair-demo.yml"
  pull_request:
    paths:
      - "algorithms/divide_and_conquer/closest_pair_points/demo-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithms/divide_and_conquer/closest_pair_points/demo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: algorithms/divide_and_conquer/closest_pair_points/demo-web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
